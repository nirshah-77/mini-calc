name: Terraform Destroy

# ── Only runs when YOU manually click "Run workflow" in GitHub Actions UI ──
# Never triggered automatically on push.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm teardown of EC2 infrastructure'
        required: true

jobs:
  terraform-destroy:
    name: Destroy EC2 Infrastructure
    runs-on: ubuntu-latest
    # Safety guard: job only proceeds if the user typed "destroy"
    if: ${{ github.event.inputs.confirm == 'destroy' }}
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_key_name:       ${{ secrets.TF_VAR_KEY_NAME }}
      TF_VAR_s3_bucket:      ${{ secrets.TF_VAR_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_VAR_S3_BUCKET }}" \
            -backend-config="region=us-east-1"

      - name: Terraform Destroy
        working-directory: ./terraform
        run: terraform destroy -auto-approve

      - name: Done
        run: echo "EC2 instance and all associated resources have been destroyed."
