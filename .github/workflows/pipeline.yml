name: DevOps Pipeline
# Flow: Push → Build Java → Docker Hub → Terraform EC2 → Chef via SSH → Container
on:
  push:
    branches:
      - main

jobs:
  # ── JOB 1: Compile Java, build & push Docker image ────────────
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
      - name: Compile
        run: javac SqrtApp.java
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: nirshah77/sqrt-app:latest

  # ── JOB 2: Terraform creates the EC2 instance ─────────────────
  terraform-apply:
    name: Terraform Apply
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_key_name:       ${{ secrets.TF_VAR_KEY_NAME }}
      TF_VAR_s3_bucket:      ${{ secrets.TF_VAR_S3_BUCKET }}
    outputs:
      server_ip: ${{ steps.out.outputs.server_ip }}
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false
      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_VAR_S3_BUCKET }}" \
            -backend-config="region=us-east-1"
      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve
      - name: Get server IP
        id: out
        working-directory: ./terraform
        run: echo "server_ip=$(terraform output -raw server_public_ip)" >> $GITHUB_OUTPUT

  # ── JOB 3: SSH into EC2, run Chef, verify container ───────────
  chef-deploy:
    name: Chef Deploy via SSH
    needs: terraform-apply
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ needs.terraform-apply.outputs.server_ip }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # FIX 1: Proper retry loop with exit 1 on failure
      - name: Wait for EC2 SSH to be ready
        run: |
          echo "Waiting for SSH on $SERVER_IP..."
          for i in $(seq 1 20); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              ubuntu@$SERVER_IP "echo ready" 2>/dev/null; then
              echo "SSH is up!"
              ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
              exit 0
            fi
            echo "Attempt $i/20 failed, retrying in 15s..."
            sleep 15
          done
          echo "ERROR: SSH never became available"
          exit 1

      - name: Install Chef on EC2
        run: |
          ssh ubuntu@$SERVER_IP \
            "curl -L https://omnitruck.chef.io/install.sh | sudo bash -s -- -v 18"

      # FIX 2: Copy the entire cookbook, not just the recipe file
      - name: Copy cookbook to EC2
        run: |
          ssh ubuntu@$SERVER_IP "sudo mkdir -p /var/chef/cookbooks && sudo chown ubuntu:ubuntu /var/chef/cookbooks"
          scp -r chef/cookbooks/docker_setup ubuntu@$SERVER_IP:/var/chef/cookbooks/

      # FIX 3: Use chef-client (not chef-apply) with a config file
      - name: Run Chef recipe
        run: |
          ssh ubuntu@$SERVER_IP bash << 'EOF'
            # Create chef config pointing to cookbook path
            sudo mkdir -p /etc/chef
            sudo bash -c 'echo "cookbook_path [\"/var/chef/cookbooks\"]" > /etc/chef/client.rb'

            # Run chef-client in local mode
            sudo CHEF_LICENSE=accept chef-client \
              --local-mode \
              --runlist 'recipe[docker_setup::default]' \
              --logfile /tmp/chef-run.log \
              --log_level info

            # Print logs so they show in GitHub Actions
            cat /tmp/chef-run.log
          EOF

      # FIX 4: Use sudo for docker commands in verify step
      - name: Verify container is running
        run: |
          echo "=== Running containers ==="
          ssh ubuntu@$SERVER_IP "sudo docker ps"
          echo "=== Images ==="
          ssh ubuntu@$SERVER_IP "sudo docker images"
          echo "=== Container logs ==="
          ssh ubuntu@$SERVER_IP "sudo docker logs sqrt-app"