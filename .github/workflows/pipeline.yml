name: DevOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Build Java, Build Docker image, Push to Docker Hub
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Compile Java application
        run: javac SqrtApp.java

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: nirshah77/sqrt-app:latest

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Terraform — provision EC2 infra on AWS
  # ──────────────────────────────────────────────────────────────
  terraform-apply:
    name: Terraform Apply
    needs: build-and-push
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_ami:            ${{ secrets.TF_VAR_AMI }}
      TF_VAR_key_name:       ${{ secrets.TF_VAR_KEY_NAME }}
      TF_VAR_s3_bucket:      ${{ secrets.TF_VAR_S3_BUCKET }}
      TF_VAR_github_owner:   ${{ github.repository_owner }}
      TF_VAR_github_repo:    ${{ github.event.repository.name }}

    outputs:
      master_ip: ${{ steps.tfout.outputs.master_ip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_VAR_S3_BUCKET }}" \
            -backend-config="region=us-east-1"

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve

      - name: Capture outputs
        id: tfout
        working-directory: ./terraform
        run: |
          echo "master_ip=$(terraform output -raw master_public_ip)" >> $GITHUB_OUTPUT
          echo "worker_ip=$(terraform output -raw worker_public_ip)"

  # ──────────────────────────────────────────────────────────────
  # JOB 3: Deploy to Kubernetes cluster on EC2
  # ──────────────────────────────────────────────────────────────
  deploy-kubernetes:
    name: Deploy to Kubernetes
    needs: terraform-apply
    runs-on: ubuntu-latest

    env:
      MASTER_IP: ${{ needs.terraform-apply.outputs.master_ip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$MASTER_IP" >> ~/.ssh/known_hosts

      - name: Wait for EC2 to be reachable
        run: |
          for i in $(seq 1 20); do
            ssh -o ConnectTimeout=10 ubuntu@"$MASTER_IP" "echo 'SSH ready'" && break
            echo "Attempt $i: waiting 30s..."
            sleep 30
          done

      - name: Wait for Chef bootstrap to finish
        run: |
          echo "Waiting for Chef bootstrap (up to 40 min)..."
          for i in $(seq 1 80); do
            if ssh ubuntu@"$MASTER_IP" "test -f /tmp/chef_done" 2>/dev/null; then
              echo "✅ Chef bootstrap complete!"
              break
            fi
            # Print last 5 lines of the bootstrap log every minute for visibility
            echo "--- [Attempt $i/80] Bootstrap log tail ---"
            ssh ubuntu@"$MASTER_IP" "tail -5 /var/log/chef-bootstrap.log 2>/dev/null || echo '(log not yet available)'"
            if [ $i -eq 80 ]; then
              echo "❌ Timed out waiting for Chef bootstrap after 40 minutes"
              ssh ubuntu@"$MASTER_IP" "cat /var/log/chef-bootstrap.log"
              exit 1
            fi
            sleep 30
          done

      - name: Copy Kubernetes manifests to master
        run: |
          scp -r k8s/ ubuntu@"$MASTER_IP":/home/ubuntu/k8s

      - name: Wait for all nodes to be Ready
        run: |
          ssh ubuntu@"$MASTER_IP" "kubectl wait --for=condition=Ready nodes --all --timeout=600s"

      - name: Deploy application to Kubernetes
        run: |
          ssh ubuntu@"$MASTER_IP" "kubectl apply -f /home/ubuntu/k8s/deployment.yaml"
          ssh ubuntu@"$MASTER_IP" "kubectl apply -f /home/ubuntu/k8s/service.yaml"

      - name: Verify deployment
        run: |
          ssh ubuntu@"$MASTER_IP" "kubectl rollout status deployment/calc-deployment --timeout=120s"
          ssh ubuntu@"$MASTER_IP" "kubectl get pods -o wide"
          ssh ubuntu@"$MASTER_IP" "kubectl get svc calc-service"