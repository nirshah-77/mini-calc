name: DevOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v3


      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'


      - name: Build Java Application
        run: mvn clean package


      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/sqrt-app:latest .


      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/sqrt-app:latest


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2


      - name: Terraform Init
        working-directory: terraform
        run: terraform init


      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve


      - name: Get Master Node IP
        id: tfoutput
        working-directory: terraform
        run: echo "MASTER_IP=$(terraform output -raw master_public_ip)" >> $GITHUB_ENV


      - name: Wait for Kubernetes Cluster
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$MASTER_IP "
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          "


      - name: Deploy Application to Kubernetes
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$MASTER_IP "
          kubectl apply -f /home/ubuntu/k8s/deployment.yaml
          kubectl apply -f /home/ubuntu/k8s/service.yaml
          "