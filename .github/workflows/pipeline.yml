name: DevOps Pipeline
# Workflow: GitHub → Build Java → Docker Hub → Terraform EC2 → Chef (Docker install + pull + run)

on:
  push:
    branches:
      - main

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Compile Java → Build Docker Image → Push to Docker Hub
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Compile Java application
        run: javac SqrtApp.java

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: nirshah77/sqrt-app:latest

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Terraform provisions EC2 → Chef runs on boot via
  #         user_data: installs Docker, pulls image, runs container
  # ──────────────────────────────────────────────────────────────
  terraform-apply:
    name: Terraform Apply (Provision EC2)
    needs: build-and-push
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_key_name:       ${{ secrets.TF_VAR_KEY_NAME }}
      TF_VAR_s3_bucket:      ${{ secrets.TF_VAR_S3_BUCKET }}

    outputs:
      server_ip: ${{ steps.tfout.outputs.server_ip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_VAR_S3_BUCKET }}" \
            -backend-config="region=us-east-1"

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve

      - name: Capture server IP
        id: tfout
        working-directory: ./terraform
        run: |
          echo "server_ip=$(terraform output -raw master_public_ip)" >> $GITHUB_OUTPUT

  # ──────────────────────────────────────────────────────────────
  # JOB 3: Wait for Chef bootstrap, then verify container is running
  # ──────────────────────────────────────────────────────────────
  verify-container:
    name: Verify Docker Container Running
    needs: terraform-apply
    runs-on: ubuntu-latest

    env:
      SERVER_IP: ${{ needs.terraform-apply.outputs.server_ip }}

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

      - name: Wait for EC2 to accept SSH
        run: |
          for i in $(seq 1 20); do
            ssh -o ConnectTimeout=10 ubuntu@"$SERVER_IP" "echo SSH ready" 2>/dev/null && break
            echo "Attempt $i/20 — waiting 30s..."
            sleep 30
          done

      - name: Wait for Chef bootstrap to complete
        run: |
          echo "Polling for /tmp/chef_done (Chef: install Docker → pull image → run container)..."
          for i in $(seq 1 40); do
            if ssh ubuntu@"$SERVER_IP" "test -f /tmp/chef_done" 2>/dev/null; then
              echo "✅ Chef bootstrap complete!"
              break
            fi
            echo "--- [Attempt $i/40] Bootstrap log tail ---"
            ssh ubuntu@"$SERVER_IP" "tail -3 /var/log/chef-bootstrap.log 2>/dev/null || echo '(log not yet available)'"
            [ $i -eq 40 ] && { echo "❌ Timed out — dumping full log:"; ssh ubuntu@"$SERVER_IP" "cat /var/log/chef-bootstrap.log"; exit 1; }
            sleep 30
          done

      - name: Verify Docker container is running
        run: |
          echo "=== Docker containers on EC2 ==="
          ssh ubuntu@"$SERVER_IP" "docker ps"
          echo ""
          echo "=== Container logs ==="
          ssh ubuntu@"$SERVER_IP" "docker logs sqrt-app"

