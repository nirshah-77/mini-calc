name: DevOps Pipeline
# Flow: Push → Build Java → Docker Hub → Terraform EC2 → Chef via SSH → Container

on:
  push:
    branches:
      - main

jobs:
  # ── JOB 1: Compile Java, build & push Docker image ────────────
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Compile
        run: javac SqrtApp.java

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: nirshah77/sqrt-app:latest

  # ── JOB 2: Terraform creates the EC2 instance ─────────────────
  terraform-apply:
    name: Terraform Apply
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_key_name:       ${{ secrets.TF_VAR_KEY_NAME }}
      TF_VAR_s3_bucket:      ${{ secrets.TF_VAR_S3_BUCKET }}
    outputs:
      server_ip: ${{ steps.out.outputs.server_ip }}
    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_VAR_S3_BUCKET }}" \
            -backend-config="region=us-east-1"

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve

      - name: Get server IP
        id: out
        working-directory: ./terraform
        run: echo "server_ip=$(terraform output -raw master_public_ip)" >> $GITHUB_OUTPUT

  # ── JOB 3: SSH into EC2, run Chef, verify container ───────────
  chef-deploy:
    name: Chef Deploy via SSH
    needs: terraform-apply
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ needs.terraform-apply.outputs.server_ip }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Wait for EC2 SSH to be ready
        run: |
          for i in $(seq 1 15); do
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              ubuntu@$SERVER_IP "echo ready" 2>/dev/null && break
            echo "Waiting... ($i/15)"
            sleep 20
          done
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

      - name: Install Chef on EC2
        run: |
          ssh ubuntu@$SERVER_IP "curl -L https://omnitruck.chef.io/install.sh | sudo bash"

      - name: Copy cookbook to EC2
        run: |
          ssh ubuntu@$SERVER_IP "sudo mkdir -p /var/chef/cookbooks"
          scp -r chef/cookbooks/k8s_setup ubuntu@$SERVER_IP:/tmp/k8s_setup
          ssh ubuntu@$SERVER_IP "sudo mv /tmp/k8s_setup /var/chef/cookbooks/"

      - name: Run Chef-solo
        run: |
          ssh ubuntu@$SERVER_IP "
            echo '{\"run_list\":[\"recipe[k8s_setup]\"]}' | sudo tee /tmp/node.json
            echo 'cookbook_path [\"/var/chef/cookbooks\"]' | sudo tee /tmp/solo.rb
            sudo chef-solo -c /tmp/solo.rb -j /tmp/node.json
          "

      - name: Verify container is running
        run: |
          ssh ubuntu@$SERVER_IP "docker ps"
          ssh ubuntu@$SERVER_IP "docker logs sqrt-app"